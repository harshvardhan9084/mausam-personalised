  <link rel="stylesheet" href="src/styles/chat.css" />

<body data-theme="dark">

  <a class="skip-link" href="#home-scroll">Skip to content</a>

  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <span class="app-name" id="brand"></span>
        <button class="city-btn" id="city-btn" type="button" aria-haspopup="dialog" title="Change location">
          <span aria-hidden="true">📍</span>
          <span class="city-name" id="city-label">…</span>

      </div>

      <div class="header-right">
        <span class="offline-pill" id="offline-pill" role="status">📴 <span data-i18n="offline">Offline</span></span>
        <span class="src-pill" id="src-pill" role="status" title="Active data source"><span class="src-dot"></span><span id="src-label">Open-Meteo</span></span>
        <button class="btn btn-icon" id="refresh-btn" type="button" title="Refresh" aria-label="Refresh weather">

    <main id="pages" class="pages">

      </section>

      <!-- ============ PAGE · RADAR ============ -->

      <!-- ============ PAGE · MITRA (AI chat) ============ -->

      <!-- ============ PAGE · YOU (profile) ============ -->

        <div class="page-scroll" id="you-mount"></div>
      </section>

      <!-- ============ PAGE · SETTINGS ============ -->

        <div class="page-scroll" id="settings-mount"></div>
      </section>
    </main>

    <!-- ============ BOTTOM NAV ============ -->
    <nav class="tab-nav" aria-label="Main navigation">
      <button class="tab-btn active" id="tab-home" type="button" aria-current="page">
        <span class="tab-ico" aria-hidden="true">🏠</span><span class="tab-lbl" data-i18n="nav_home">Home</span>
      </button>
      <button class="tab-btn" id="tab-radar" type="button" aria-current="false">
        <span class="tab-ico" aria-hidden="true">🗺️</span><span class="tab-lbl" data-i18n="nav_radar">Radar</span>
      </button>
      <button class="tab-btn" id="tab-mitra" type="button" aria-current="false">
        <span class="tab-ico" aria-hidden="true">💬</span><span class="tab-lbl" data-i18n="nav_mitra">Mitra</span>
      </button>
      <button class="tab-btn" id="tab-you" type="button" aria-current="false">
        <span class="tab-ico" aria-hidden="true">✨</span><span class="tab-lbl" data-i18n="nav_you">You</span>
      </button>
      <button class="tab-btn" id="tab-settings" type="button" aria-current="false">
        <span class="tab-ico" aria-hidden="true">⚙️</span><span class="tab-lbl" data-i18n="nav_settings">Settings</span>

  <!-- ============ MODAL · LOCATION SEARCH ============ -->
  <div class="modal-overlay" id="search-modal" role="dialog" aria-modal="true" aria-label="Change location">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" data-i18n="search_title">Change location</span>
        <button class="modal-close" id="search-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input class="search-input" id="search-input" type="search"
               placeholder="Search any city, town or village…"
               autocomplete="off" spellcheck="false" aria-label="Search for a city" />
      </div>
      <button class="btn use-loc-btn" id="use-loc-btn" type="button">📡 <span data-i18n="use_my_loc">Use my location</span></button>
      <div class="search-results" id="search-results" style="position:static; box-shadow:none; border:none; background:transparent;"></div>
    </div>

  <noscript>
    <div style="padding:40px; text-align:center; font-family:sans-serif;">
      <h1>Mausam needs JavaScript</h1>
      <p>This app fetches live weather, radar and an AI assistant in your browser. Please enable JavaScript.</p>
    </div>
  </noscript>

  <script>
    /* Upgrade shim: if a service worker from an older Mausam build is
       controlling this page, clear it once and reload so every module is
       served fresh. The new sw.js answers MAUSAM_VERSION; old ones can't. */
    (function () {
      try {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        if (sessionStorage.getItem('mausam:swcheck') === 'v0.5.0') return;
        var sw = navigator.serviceWorker.controller;
        var done = false;
        var t = setTimeout(function () {
          if (done) return; done = true;
          hardRefresh();
        }, 450);
        var ch = new MessageChannel();
        ch.port1.onmessage = function (e) {
          if (done) return; done = true; clearTimeout(t);
          if (e && e.data && e.data.version === 'v0.5.0') {
            sessionStorage.setItem('mausam:swcheck', 'v0.5.0');
          } else {
            hardRefresh();
          }
        };
        sw.postMessage({ type: 'MAUSAM_VERSION' }, [ch.port2]);
        function hardRefresh() {
          sessionStorage.setItem('mausam:swcheck', 'v0.5.0');
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              }).finally(function () { location.reload(); });
            } else location.reload();
          }).catch(function () { location.reload(); });
        }
      } catch (e) { /* never block the app */ }
    })();
  </script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
