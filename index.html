<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mausam — Personalized Weather · Ghaziabad</title>
  <meta name="description" content="Mausam — Personalized weather homepage by IMD. Tailored dashboards for fitness, commuters, farmers, travelers, and event planners." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ================================================================
     SCREEN 1: PERSONA SELECTION
================================================================ -->
<div id="persona-screen">
  <div class="logo-block">
    <div class="logo-title">☁️ Mausam</div>
    <div class="logo-sub">India Meteorological Department &nbsp;·&nbsp; Ministry of Earth Sciences</div>
    <div class="logo-tag">SIH 2026 &nbsp;·&nbsp; Problem ID 26076 &nbsp;·&nbsp; Ghaziabad, UP</div>
  </div>

  <p class="select-label">Who are you? Select your profile.</p>

  <div class="persona-grid" id="persona-grid">
    <!-- Built by app.js -->
  </div>
</div>


<!-- ================================================================
     SCREEN 2: DASHBOARD (content injected by JS per persona)
================================================================ -->
<div id="dashboard-screen">

  <header class="app-header">
    <div class="header-left">
      <span class="app-name">☁️ Mausam</span>
      <span class="persona-badge" id="persona-badge-text">—</span>
      <span class="city-label">📍 Ghaziabad, UP</span>
    </div>
    <div class="header-right">
      <button class="btn" onclick="openSwitch()">Switch Profile</button>
    </div>
  </header>

  <div class="dash-content">
    <div id="dash-content-area">
      <!-- Persona-specific content injected here -->
    </div>
  </div>

</div>


<!-- ================================================================
     MODAL: Switch Persona
================================================================ -->
<div class="modal-overlay" id="switch-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Switch Your Profile</span>
      <button class="modal-close" onclick="closeSwitch()">✕</button>
    </div>
    <div class="persona-grid" id="modal-persona-grid">
      <!-- Built by app.js -->
    </div>
  </div>
</div>


<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
