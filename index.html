  <title>Mausam — weather that works like it's yours</title>

  <noscript>
    <div style="padding:40px; text-align:center; font-family:sans-serif;">

      <p>This app fetches live weather, crop calendars and an AI assistant in your browser. Please enable JavaScript.</p>
    </div>

  <script>
    /* Upgrade shim: if a service worker from an older Mausam build is
       controlling this page, clear it once and reload so every module is
       served fresh. The new sw.js answers MAUSAM_VERSION; old ones can't. */
    (function () {
      try {
        if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
        if (sessionStorage.getItem('mausam:swcheck') === 'v0.8.20') return;
        var sw = navigator.serviceWorker.controller;
        var done = false;
        var t = setTimeout(function () {
          if (done) return; done = true;
          hardRefresh();
        }, 450);
        var ch = new MessageChannel();
        ch.port1.onmessage = function (e) {
          if (done) return; done = true; clearTimeout(t);
          if (e && e.data && e.data.version === 'v0.8.20') {
            sessionStorage.setItem('mausam:swcheck', 'v0.8.20');
          } else {
            hardRefresh();
          }
        };
        sw.postMessage({ type: 'MAUSAM_VERSION' }, [ch.port2]);
        function hardRefresh() {
          sessionStorage.setItem('mausam:swcheck', 'v0.8.20');
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              }).finally(function () { location.reload(); });
            } else location.reload();
          }).catch(function () { location.reload(); });
        }
      } catch (e) { /* never block the app */ }
    })();
  </script>

  <script type="module" src="src/main.js"></script>
